# cloudbuild.yaml — CD pipeline (runs on push to main via trigger "cd-tri1")
# Vertex AI + Firestore version: NO secrets (auth is via the service account).
# Config is passed as plain, non-sensitive env vars.
 
steps:
  # 1. Build the Streamlit image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'
      - '.'
 
  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'
 
  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'langgraph-chatbot'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--session-affinity'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=interview-509017,GCP_LOCATION=us-central1,FIRESTORE_DATABASE=default,FIRESTORE_COLLECTION=energy_docs'
 
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'
 
timeout: 1800s
 
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'