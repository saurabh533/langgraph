# cloudbuild.yaml — CD pipeline (runs on push to main via trigger "cd-tri1")
# Builds your Streamlit image, pushes it, and deploys to Cloud Run with all 4 secrets.

steps:
  # 1. Build the Docker image (tagged with the git commit short SHA)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'
      - '.'

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'langgraph-chatbot'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--session-affinity'
      - '--set-secrets=GROQ_API_KEY=GROQ_API_KEY:latest,ASTRA_DB_APPLICATION_TOKEN=ASTRA_DB_APPLICATION_TOKEN:latest,ASTRA_DB_API_ENDPOINT=ASTRA_DB_API_ENDPOINT:latest,ASTRA_COLLECTION=ASTRA_COLLECTION:latest'

# Store the built image in the build record
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/langgraph-chatbot:$SHORT_SHA'

# The heavy ML image needs a longer build budget and a bigger machine
timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
